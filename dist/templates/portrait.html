<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
* { box-sizing: border-box; }
body { margin: 0px; background: rgb(16, 28, 42); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: rgb(238, 243, 245); }
.land { fill: rgb(48, 67, 85); stroke: rgb(65, 85, 104); stroke-width: 0.5; }
.graticule { fill: none; stroke: rgb(88, 112, 131); stroke-width: 0.5; opacity: 0.17; }
.route-glow { fill: none; stroke: rgb(223, 183, 111); opacity: 0.08; }
.route { fill: none; stroke: rgb(232, 191, 121); stroke-linecap: round; opacity: 0.78; }
.airport { fill: rgb(250, 227, 180); stroke: rgb(23, 43, 58); stroke-width: 1.4; }
.extreme-ring { fill: none; stroke: rgb(245, 213, 154); stroke-width: 1; opacity: 0.7; }
.record-main { letter-spacing: 1px; color: rgb(242, 244, 246); font-size: 18px; }
.distance { color: rgb(240, 213, 164); white-space: nowrap; font-size: 22px; }
.distance-record .coord { display: none; }
.airport-leader { stroke: rgb(171, 183, 188); stroke-width: 0.65; opacity: 0.55; fill: none; }
header { position: absolute; display: flex; justify-content: space-between; align-items: end; z-index: 2; left: 64px; right: 64px; top: 47px; }
.eyebrow { color: rgb(145, 166, 184); margin-bottom: 14px; font-size: 17px; letter-spacing: 3px; }
#map { position: absolute; left: 0px; top: 115px; width: 1080px; height: 574px; }
.airport-label { fill: rgb(236, 241, 244); paint-order: stroke; stroke: rgb(23, 38, 52); stroke-linejoin: round; font-size: 21px; stroke-width: 2px; }
.region { fill: rgb(154, 175, 189); opacity: 0.28; letter-spacing: 7px; text-anchor: middle; font-size: 19px; }
.distance-record .record-label { margin-bottom: 9px; }
.record-label { color: rgb(146, 168, 185); font-size: 14px; letter-spacing: 1px; margin-bottom: 8px; }
.overview .record-main { font-size: 27px; }
.overview .record-main small { color: rgb(161, 180, 194); margin-left: 5px; font-size: 14px; }
.overview .record-main.airport-name { font-size: 21px; }
.record-main span { color: rgb(223, 188, 126); font-size: 17px; margin-left: 7px; }
.coord { color: rgb(161, 180, 194); letter-spacing: 0.6px; font-size: 14px; margin-top: 5px; }
#poster { position: relative; overflow: hidden; background: radial-gradient(at 56% 24%, rgb(33, 55, 74) 0%, rgb(20, 35, 49) 48%, rgb(16, 28, 42) 100%); width: 1080px; height: 1150px; }
.extremes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.extremes .record-main { font-size: 18px; white-space: nowrap; }
.extremes .record-main span { font-size: 14px; margin-left: 5px; }
.extremes .coord { margin-top: 5px; font-size: 13px; }
.records { position: absolute; border-top: 1px solid rgb(169, 141, 94); border-bottom: 1px solid rgb(64, 81, 100); z-index: 2; inset: 730px 64px auto; width: auto; background: linear-gradient(140deg, rgba(25, 43, 59, 0.75), rgba(18, 34, 49, 0.55)); padding: 23px 28px; }
.distance-group .record-label { margin-bottom: 5px; }
.distance-record { border: 0px; margin: 0px; justify-content: space-between; display: flex; gap: 12px; align-items: center; padding: 8px 0px; }
.distance-record + .distance-record { border-top: 1px solid rgba(146, 168, 185, 0.13); }
.distance-record .record-main { font-size: 16px; line-height: 1.45; letter-spacing: 0px; }
.distance-record .distance { font-size: 21px; margin: 0px; }
.distance small { color: rgb(169, 184, 195); margin-left: 5px; font-size: 12px; }
.records-title { font-weight: 500; color: rgb(241, 212, 161); letter-spacing: 5px; font-size: 22px; margin-bottom: 16px; }
.overview { display: grid; border-bottom: 1px solid rgb(59, 77, 94); grid-template-columns: repeat(4, 1fr); gap: 18px; padding-bottom: 14px; margin-bottom: 14px; }
#distances { display: grid; border-top: 1px solid rgb(59, 77, 94); grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 14px; padding-top: 12px; }
.leg-flight { font-size: 11px; opacity: 0.72; margin-left: 8px; white-space: nowrap; font-weight: 400; }
</style></head><body><div id="poster"><header><div><div class="eyebrow">A PERSONAL ATLAS OF JOURNEYS</div></div></header><svg id="map" viewBox="0 0 1600 850"></svg><aside class="records"><div class="records-title">足迹的边界</div><div class="overview" id="overview"></div><div class="extremes" id="extremes"></div><div id="distances"></div></aside></div>
<script src="palette.js"></script><script src="vendor/d3.min.js"></script><script src="vendor/topojson.min.js"></script><script src="vendor/html-to-image.js"></script><script>

const feature=topojson.feature;
const data=__DATA__;
applyAtlasTheme(data.colors);
const world=__WORLD__;
;
const airports=data.airports;
const names={SHA:'上海虹桥',PVG:'上海浦东',PKX:'北京大兴',PEK:'北京首都',CAN:'广州',SZX:'深圳',LAX:'洛杉矶',JFK:'纽约',CDG:'巴黎',IST:'伊斯坦布尔',HND:'东京羽田',NRT:'东京成田',KIX:'大阪关西',MNL:'马尼拉',CAI:'开罗',LXR:'卢克索',ASW:'阿斯旺',ORD:'芝加哥',RDU:'罗利',DTW:'底特律',MAN:'曼彻斯特',MUC:'慕尼黑',FRA:'法兰克福',HKG:'香港',KEF:'凯夫拉维克',PEN:'槟城',KUL:'吉隆坡',SIN:'新加坡',SEA:'西雅图',AES:'奥勒松',BGO:'卑尔根',DXB:'迪拜',LYR:'朗伊尔城'};

function airportName(code){
 if(data.airportNames?.[code])return data.airportNames[code];
 if(names[code])return names[code];
 const a=airports[code]||{};
 for(const value of [a.city,a.name]){const name=String(value||'').trim();if(name&&name.toUpperCase()!==code.toUpperCase())return name;}
 return code;
}
function airportLabel(code){const name=airportName(code);return name.toUpperCase()===code.toUpperCase()?code:`${name} ${code}`;}
function escapeLabel(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function airportHtml(code){const name=airportName(code);return name.toUpperCase()===code.toUpperCase()?escapeLabel(code):`${escapeLabel(name)}<span>${escapeLabel(code)}</span>`;}

const projection=d3.geoMercator().rotate([-125,0]).center([0,36]).scale(1600/(2*Math.PI)).translate([800,425]).clipExtent([[0,0],[1600,850]]),path=d3.geoPath(projection),svg=d3.select('#map');
svg.append('path').datum(d3.geoGraticule10()).attr('class','graticule').attr('d',path);
svg.append('g').selectAll('path').data(feature(world,world.objects.countries).features).join('path').attr('class','land').attr('d',path);
for(const [n,xy] of [['欧洲',[20,51]],['非洲',[20,0]],['亚洲',[79,40]],['北美洲',[-105,48]],['南美洲',[-60,-16]],['印度洋',[76,-18]],['太平洋',[167,0]]]){const [x,y]=projection(xy);svg.append('text').attr('class','region').attr('x',x).attr('y',y).text(n)}
const routeGeo=r=>({type:'LineString',coordinates:[airports[r.a].xy,airports[r.b].xy]});
svg.append('g').selectAll('path').data(data.routes).join('path').attr('class','route-glow').attr('d',r=>path(routeGeo(r))).attr('stroke-width',r=>5+Math.sqrt(r.flights.length)*1.9);
svg.append('g').selectAll('path').data(data.routes).join('path').attr('class','route').attr('d',r=>path(routeGeo(r))).attr('stroke-width',r=>.9+Math.sqrt(r.flights.length)*.8);
svg.append('g').selectAll('circle').data(Object.entries(airports).sort((a,b)=>a[1].n-b[1].n)).join('circle').attr('class','airport').attr('cx',([c,a])=>projection(a.xy)[0]).attr('cy',([c,a])=>projection(a.xy)[1]).attr('r',([c,a])=>2+Math.sqrt(a.n)*.55);
const extremes=new Set(Object.values(data.extremes));svg.append('g').selectAll('circle').data([...extremes]).join('circle').attr('class','extreme-ring').attr('cx',c=>projection(airports[c].xy)[0]).attr('cy',c=>projection(airports[c].xy)[1]).attr('r',10);

const routeSamples=[];
svg.selectAll('.route').each(function(){const length=this.getTotalLength();for(let t=0;t<length;t+=5){const p=this.getPointAtLength(t);routeSamples.push([p.x,p.y]);}});
const airportPoints=Object.entries(airports).map(([code,a])=>({code,p:projection(a.xy)}));
const boxes=[];
const labelGroup=svg.append('g');
for(const c of new Set(Array.isArray(data.labels)?data.labels:[...Object.values(data.extremes),'CDG','DXB','IST','CAI','LAX','RDU'])){
 if(!airports[c])continue;
 const [px,py]=projection(airports[c].xy),text=airportLabel(c);
 const node=labelGroup.append('text').attr('class','airport-label').text(text);
 const width=node.node().getComputedTextLength(),height=26;
 const radius=extremes.has(c)?11:2+Math.sqrt(airports[c].n)*.55;
 const options=[];
 for(const gap of [5,10,16]){
  const r=radius+gap;
  options.push([px+r,py-height/2],[px-r-width,py-height/2],[px-width/2,py-r-height],[px-width/2,py+r],[px+r*.7,py-r-height],[px-r*.7-width,py-r-height],[px+r*.7,py+r],[px-r*.7-width,py+r]);
 }
 let best=null;
 for(const [x,y] of options){
  if(x<10||x+width>1590||y<5||y+height>845)continue;
  const b=[x-2,y-2,width+4,height+4];
  const overlaps=boxes.filter(o=>b[0]<o[0]+o[2]+6&&b[0]+b[2]+6>o[0]&&b[1]<o[1]+o[3]+4&&b[1]+b[3]+4>o[1]).length;
  let crossings=0;for(const p of routeSamples)if(p[0]>b[0]&&p[0]<b[0]+b[2]&&p[1]>b[1]&&p[1]<b[1]+b[3])crossings++;
  let points=0;for(const a of airportPoints)if(a.code!==c&&a.p[0]>b[0]-3&&a.p[0]<b[0]+b[2]+3&&a.p[1]>b[1]-3&&a.p[1]<b[1]+b[3]+3)points++;
  const ax=Math.max(x,Math.min(x+width,px)),ay=Math.max(y,Math.min(y+height,py));
  const distance=Math.hypot(ax-px,ay-py);
  const score=overlaps*10000+points*120+crossings*4+distance*.6;
  if(!best||score<best.score)best={x,y,b,ax,ay,distance,score};
 }
 if(c === 'RDU'){const x=Math.min(px+12,1588-width),y=py-7,ax=Math.max(x,Math.min(x+width,px)),ay=y;best={x,y,b:[x-2,y-2,width+4,height+4],ax,ay,distance:Math.hypot(ax-px,ay-py),score:0};}
 if(!best){node.remove();continue;}
 boxes.push(best.b);
 node.attr('data-airport',c).attr('x',best.x).attr('y',best.y+20);
 if(best.distance>radius+9){const dx=best.ax-px,dy=best.ay-py,l=Math.hypot(dx,dy);labelGroup.insert('path','text').attr('class','airport-leader').attr('d',`M${px+dx/l*(radius+2)},${py+dy/l*(radius+2)} L${best.ax},${best.ay}`);}
}
const labels={north:'最北到达',south:'最南到达',east:'最东到达',west:'最西到达'};
for(const k of ['north','south','east','west']){const c=data.extremes[k],a=airports[c],[lon,lat]=a.xy;const coord=k==='north'||k==='south'?`${Math.abs(lat).toFixed(2)}° ${lat>=0?'N':'S'}`:`${Math.abs(lon).toFixed(2)}° ${lon>=0?'E':'W'}`;document.getElementById('extremes').insertAdjacentHTML('beforeend',`<div><div class="record-label">${labels[k]}</div><div class="record-main">${airportHtml(c)}</div><div class="coord">${coord}</div></div>`)}
for(const [k,label] of [['longestRoutes','最长航程'],['shortestRoutes','最短航程']]){
 const group=document.createElement('section');group.className='distance-group';
 const title=document.createElement('div');title.className='record-label';title.textContent=label;group.append(title);
 for(const [index,r] of data[k].entries()){
  const row=document.createElement('div');row.className='distance-record';
  const route=document.createElement('div');route.className='record-main';route.textContent=`${airportName(r.a)} → ${airportName(r.b)}`;
  const flight=document.createElement('small');flight.className='leg-flight';const airline=String(r.airline||'').trim(),number=String(r.flight||'').trim();flight.textContent=number?(airline&&!number.toUpperCase().startsWith(airline.toUpperCase())?airline+number:number):'航班号未填写';route.append(flight);
  const value=document.createElement('div');value.className='distance';value.textContent=Math.round(r.km).toLocaleString('en-US');
  const unit=document.createElement('small');unit.textContent='km';value.append(unit);row.append(route,value);group.append(row);
 }document.getElementById('distances').append(group);
}

const overview=document.getElementById('overview');
const busiest=data.busiest;
overview.innerHTML=`<div><div class="record-label">累计飞行里程（估算）</div><div class="record-main">${data.totalKm.toLocaleString('en-US')}<small>km</small></div></div><div><div class="record-label">飞行次数</div><div class="record-main">${data.total}<small>次</small></div></div><div><div class="record-label">航司数量</div><div class="record-main">${data.airlineCount}<small>家</small></div></div><div><div class="record-label">最多起降机场 · ${airports[busiest].n} 次</div><div class="record-main airport-name">${airportHtml(busiest)}</div></div>`;
document.getElementById('poster').dataset.ready='true';
</script></body></html>
