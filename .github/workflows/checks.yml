name: Regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check application JavaScript syntax
        run: |
          for file in dist/*.js; do node --check "$file"; done
      - name: Run regression tests
        run: node --test tests/*.test.cjs

      - name: Run mini-program and cloud regression tests
        run: node --test miniprogram-tests/*.test.cjs
      - name: Verify collection manifests and source artwork
        run: |
          node scripts/stamps/build.cjs --check
          node scripts/checkin/sync-rewards.cjs --check
          node scripts/palette-library/build.cjs --check
